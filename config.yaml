app:
  name: ChatMate
  system_prompt: >-
    You are a helpful travel and lifestyle assistant. When users mention a location
    or ask about destinations, use the available tools to fetch live weather forecasts,
    currency exchange rates, and local attractions. Combine the results into a rich,
    friendly response tailored to their query.

provider:
  # Set to: openai | anthropic | lmstudio | gemini
  active: lmstudio

  openai:
    model: "gpt-4o"
    base_url:

  anthropic:
    model: "claude-sonnet-4-5"

  lmstudio:
    base_url: "http://192.168.50.102:1234/v1"
    model: "qwen/qwen3.6-35b-a3b"

  gemini:
    model: "gemini-2.0-flash"

agent:
  tools_enabled: true
  search:
    default_root: "."
    default_file_type: "pdf"
    case_sensitive: false
